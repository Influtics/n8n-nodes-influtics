name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # `npm install` (not `npm ci`) so the lockfile's optional-dep entries
      # don't break the job when registry metadata drifts. `--ignore-scripts`
      # keeps postinstall hooks disabled — this package declares none, but
      # transitive deps (esbuild, @n8n/node-cli) do.
      - run: npm install --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: n8n community-node security scan
        # Scans the latest published version on npm. Catches regressions in
        # the live package against the same ESLint ruleset the n8n
        # verified-nodes reviewer runs. `continue-on-error` so the scan is
        # advisory — provenance will only land once release.yml ships a
        # tagged build, and we don't want this PR (or any subsequent one
        # before that release) to be blocked on a fix that's still in flight.
        continue-on-error: true
        run: npx --yes @n8n/scan-community-package n8n-nodes-influtics