name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: n8n community-node security scan
        # Scans the latest published version on npm. Catches regressions in
        # the live package against the same ESLint ruleset the n8n
        # verified-nodes reviewer runs.
        run: npx --yes @n8n/scan-community-package n8n-nodes-influtics