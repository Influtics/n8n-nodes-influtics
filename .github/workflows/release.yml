name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      # `npm install` (not `npm ci`) — same rationale as ci.yml: the
      # lockfile's optional-dep entries drift over time as transitive
      # deps (nock@14 → undici, parse5, @aws-sdk/*) update on the
      # registry. `--ignore-scripts` keeps postinstall hooks disabled
      # for transitive deps that have them (esbuild, @n8n/node-cli,
      # isolated-vm, ssh2).
      - run: npm install --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}